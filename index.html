<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Automotive Specialist Services LLC — V3</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#d1d5db;--blue:#1d4ed8;--green:#15803d;--yellow:#ca8a04;--red:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{position:sticky;top:0;z-index:20;background:#111827;color:#fff;padding:14px;box-shadow:0 2px 10px #0002}.brand{font-weight:800;font-size:18px}.sub{font-size:12px;color:#d1d5db}.wrap{max-width:850px;margin:auto;padding:12px 10px 90px}.screen{display:none}.screen.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 3px #0000000a}h1,h2,h3{margin:4px 0 10px}h1{font-size:24px}h2{font-size:20px}h3{font-size:16px}label{display:block;font-size:13px;font-weight:700;margin:9px 0 5px}input,select,textarea{width:100%;border:1px solid #bfc5cc;border-radius:9px;padding:11px;font:inherit;background:#fff;color:var(--ink)}textarea{min-height:80px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}button{border:0;border-radius:10px;padding:12px 14px;font-weight:800;font-size:14px}.primary{background:var(--blue);color:#fff}.secondary{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions button{flex:1;min-width:120px}.nav{display:flex;gap:8px;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:9px;z-index:15}.nav button{flex:1}.stepbar{display:flex;overflow:auto;gap:5px;margin:8px 0}.step{min-width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#e5e7eb;font-size:11px;font-weight:800}.step.current{background:var(--blue);color:#fff}.step.done{background:#bbf7d0;color:#166534}.statusrow{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.statusrow button{padding:10px 3px;background:#f3f4f6;border:2px solid transparent}.statusrow .pass{background:#dcfce7;border-color:var(--green);color:#166534}.statusrow .attn{background:#fef3c7;border-color:var(--yellow);color:#854d0e}.statusrow .fail{background:#fee2e2;border-color:var(--red);color:#991b1b}.statusrow .na{background:#e5e7eb;border-color:#6b7280}.item{border:1px solid var(--line);border-radius:12px;padding:11px;margin:9px 0}.itemhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.small{font-size:12px;color:var(--muted)}.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}.photo{position:relative}.photo img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line)}.photo button{position:absolute;right:3px;top:3px;padding:3px 7px;border-radius:50%;background:#000b;color:#fff}.homegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.homebtn{min-height:105px;text-align:left;background:#fff;border:1px solid var(--line)}.homebtn strong{display:block;font-size:17px;margin-bottom:5px}.homebtn span{font-size:12px;color:var(--muted)}.corner{font-size:23px;font-weight:900}.report{background:#fff;padding:22px;max-width:850px;margin:auto}.report table{width:100%;border-collapse:collapse;font-size:12px;margin:10px 0}.report th,.report td{border:1px solid #d1d5db;padding:6px;text-align:left;vertical-align:top}.report th{background:#f3f4f6}.rpass{background:#dcfce7}.rattn{background:#fef3c7}.rfail{background:#fee2e2}.rphotos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.rphotos img{width:100%;max-height:190px;object-fit:cover}@media(max-width:600px){.grid{grid-template-columns:1fr}.homegrid{grid-template-columns:1fr 1fr}}@media print{body{background:#fff}.no-print,header,.nav{display:none!important}.wrap{padding:0}.report{display:block!important;max-width:none}.report-page{break-inside:avoid}}
</style></head><body>
<header class="no-print"><div class="brand">Automotive Specialist Services LLC</div><div class="sub">Professional Vehicle Inspection System — V3</div></header><div class="wrap">
<section id="home" class="screen active"><div class="card"><h1>Inspection Dashboard</h1><p class="small">One-step field workflow. Inspections autosave on this device.</p></div><div class="homegrid"><button class="homebtn" onclick="newInspection()"><strong>➕ New Inspection</strong><span>Start a complete inspection</span></button><button class="homebtn" onclick="saved()"><strong>💾 Saved Inspections</strong><span>Resume field work</span></button><button class="homebtn" onclick="reports()"><strong>📄 Reports</strong><span>View completed reports</span></button><button class="homebtn" onclick="settings()"><strong>⚙️ Settings</strong><span>Business information</span></button></div></section>
<section id="form" class="screen"><div id="steps" class="stepbar"></div><div id="content"></div><div class="nav no-print"><button class="secondary" onclick="back()">← Back</button><button class="secondary" onclick="save();msg('Saved')">💾 Save</button><button id="next" class="primary" onclick="next()">Next →</button></div></section>
<section id="list" class="screen"><div class="card"><h2 id="listTitle"></h2><div id="listBody"></div></div><button class="secondary" onclick="home()">← Dashboard</button></section>
<section id="settings" class="screen"><div class="card"><h2>Business Settings</h2><label>Business Name<input id="sName"></label><label>Default Inspector<input id="sInspector"></label><label>Report Disclaimer<textarea id="sDisclaimer"></textarea></label><div class="actions"><button class="primary" onclick="saveSettings()">Save</button><button class="secondary" onclick="home()">Back</button></div></div></section>
<section id="reportScreen" class="screen"><div class="actions no-print"><button class="secondary" onclick="home()">← Dashboard</button><button class="primary" onclick="window.print()">🖨️ Print / Save PDF</button></div><div id="report" class="report"></div></section></div>
<input id="camera" hidden type="file" accept="image/*" capture="environment"><input id="obdfile" hidden type="file" accept="application/pdf,.pdf">
<script>
const STEPS=['Customer & Vehicle','Vehicle Verification','OBD-II Scan','Exterior Condition','Test Drive','A/C & HVAC','Battery Test','Electrical','Engine / Under-Hood','Left Front','Left Rear','Right Front','Right Rear','Transmission / Drivetrain','Undercarriage','Findings Summary','Photos & Evidence','Professional Report'];
const electrical=['Headlights','Turn / Hazard Lights','Brake / Reverse Lights','License Plate Lights','Wipers / Washers','Horn','Power Windows','Power Locks','Power Mirrors','Interior Lights','Gauges / Cluster','Infotainment','Backup Camera','Parking Sensors','Power Seats','Sunroof','12V / USB'];
const engine=['Engine Oil','Coolant','Brake Fluid','Power Steering Fluid','Transmission Fluid','Belts','Hoses','Battery Area','Engine Mounts','Visible Leaks','Engine Operation','Emissions / Manufacturer Labels','A/C / Transmission Labels','Overall Engine Photos'];
const cornerItems=['Exterior / Body','Wheel / Rim','Brake','Suspension / Steering'];
let state=null,step=0,db,photoKey='';
const biz={name:'Automotive Specialist Services LLC',inspector:'',disclaimer:'This inspection is a visual and functional evaluation based on conditions observable at the time of inspection. It is not a guarantee of future performance or a substitute for specialized diagnostic, structural, or manufacturer-authorized testing. Test-drive and inspection limitations are documented when applicable.'};
function blank(){return{id:crypto.randomUUID(),updated:new Date().toISOString(),completed:false,customer:{type:'Pre-Purchase'},vehicle:{},price:'',verification:{},obd:{scan:'Yes',codes:'',warning:'',notes:'',pdfName:'',pdfText:''},test:{},hvac:{},battery:{},electrical:{},engine:{},corners:{LF:{},LR:{},RF:{},RR:{}},drivetrain:{},undercarriage:{},generalNotes:'',limitations:'',photos:{}}}
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open('ASS_V3',1);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains('inspections'))d.createObjectStore('inspections',{keyPath:'id'});if(!d.objectStoreNames.contains('settings'))d.createObjectStore('settings',{keyPath:'id'})};r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error)})}
function store(n,m='readonly'){return db.transaction(n,m).objectStore(n)}
function put(x,n='inspections'){return new Promise((ok,no)=>{let r=store(n,'readwrite').put(x);r.onsuccess=ok;r.onerror=()=>no(r.error)})}
function all(n='inspections'){return new Promise((ok,no)=>{let r=store(n).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function get(id){return new Promise((ok,no)=>{let r=store('inspections').get(id);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function del(id){return new Promise((ok,no)=>{let r=store('inspections','readwrite').delete(id);r.onsuccess=ok;r.onerror=()=>no(r.error)})}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}
function home(){save();show('home')}
function newInspection(){state=blank();step=0;show('form');render()}
async function saved(){show('list');document.getElementById('listTitle').textContent='Saved Inspections';renderList(await all())}
async function reports(){show('list');document.getElementById('listTitle').textContent='Completed Reports';renderList((await all()).filter(x=>x.completed))}
function renderList(a){a.sort((x,y)=>y.updated.localeCompare(x.updated));document.getElementById('listBody').innerHTML=a.length?a.map(x=>`<div class="item"><b>${esc((x.customer.name||'Unnamed')+' — '+(x.vehicle.year||'')+' '+(x.vehicle.make||'')+' '+(x.vehicle.model||''))}</b><div class="small">${new Date(x.updated).toLocaleString()}</div><div class="actions"><button class="primary" onclick="load('${x.id}')">Open</button><button class="danger" onclick="removeIt('${x.id}')">Delete</button></div></div>`).join(''):'<p class="small">None saved.</p>'}
async function load(id){state=await get(id);step=0;show('form');render()}
async function removeIt(id){if(confirm('Delete this inspection?')){await del(id);saved()}}
function save(){if(!state)return;state.updated=new Date().toISOString();put(state).catch(()=>{})}
function pathGet(o,p){return p.split('.').reduce((a,k)=>a?.[k],o)}
function pathSet(o,p,v){let a=p.split('.'),x=o;for(let i=0;i<a.length-1;i++){if(!x[a[i]]||typeof x[a[i]]!=='object')x[a[i]]={};x=x[a[i]]}x[a[a.length-1]]=v}
function item(label,key,path){let v=pathGet(state,path)||{};return `<div class="item" data-item="${path}"><div class="itemhead"><b>${esc(label)}</b></div><div class="statusrow"><button class="${v.status==='PASS'?'pass':''}" onclick="status('${path}','PASS')">PASS</button><button class="${v.status==='ATTENTION'?'attn':''}" onclick="status('${path}','ATTENTION')">ATTENTION</button><button class="${v.status==='FAIL'?'fail':''}" onclick="status('${path}','FAIL')">FAIL</button><button class="${v.status==='N/A'?'na':''}" onclick="status('${path}','N/A')">N/A</button></div><textarea data-path="${path}.note" placeholder="Notes"></textarea></div>`}
function pbox(label,k){return `<div class="item"><b>${esc(label)}</b><button class="primary" onclick="photo('${k}')">📷 Take / Add Photo</button><div class="photo-grid" data-grid="${k}"></div></div>`}
function render(){document.getElementById('steps').innerHTML=STEPS.map((x,i)=>`<div class="step ${i===step?'current':''} ${i<step?'done':''}">${i+1}</div>`).join('');document.getElementById('content').innerHTML=page(step);document.getElementById('next').textContent=step===STEPS.length-1?'Finish':'Next →';hydrate()}
function page(i){
if(i===0)return `<div class="card"><h2>1. Customer & Vehicle Information</h2><div class="grid"><label>Customer Name<input data-path="customer.name"></label><label>Inspection Price<input data-path="price" type="number" step="0.01"></label><label>Inspection Type<select data-path="customer.type"><option>Pre-Purchase</option><option>Post-Purchase</option><option>Warranty</option><option>Dealer</option><option>Other</option></select></label><label>Date / Time<input data-path="customer.date" type="datetime-local"></label><label>Inspector<input data-path="customer.inspector"></label><label>Year<input data-path="vehicle.year"></label><label>Make<input data-path="vehicle.make"></label><label>Model<input data-path="vehicle.model"></label><label>VIN<input data-path="vehicle.vin"></label><label>Mileage<input data-path="vehicle.mileage"></label><label>Plate<input data-path="vehicle.plate"></label><label>State<input data-path="vehicle.state"></label></div></div>`;
if(i===1)return `<div class="card"><h2>2. Vehicle Verification</h2>${pbox('VIN on Dashboard','vin_dash')}${pbox('VIN Manufacturer Placard','vin_placard')}${pbox('Tire Placard','tire_placard')}${pbox('Odometer / Mileage','odometer')}${pbox('Dashboard — Ignition On','dash_ignition')}${pbox('Dashboard — Engine Running','dash_running')}<label>Warning / Indicator Light Notes<textarea data-path="verification.warningNotes"></textarea></label><label>Oil-Change Sticker<select data-path="verification.oilSticker"><option></option><option>Present</option><option>Present but incomplete / illegible</option><option>Not present</option><option>N/A</option></select></label>${pbox('Oil-Change Sticker Photo','oil_sticker')}</div>`;
if(i===2)return `<div class="card"><h2>3. OBD-II Scan</h2><label>Scan Performed<select data-path="obd.scan"><option>Yes</option><option>No</option><option>Unable</option></select></label><label>DTC Codes<textarea data-path="obd.codes" placeholder="Example: P0300, P0420, U0100"></textarea></label><label>Warning Lights<textarea data-path="obd.warning"></textarea></label><label>Notes<textarea data-path="obd.notes"></textarea></label><div class="item"><b>OBD-II PDF Evidence</b><input id="pdf" type="file" accept="application/pdf,.pdf"><div id="pdfStatus" class="small">No PDF attached.</div></div>${pbox('OBD-II Screen / Evidence','obd_evidence')}</div>`;
if(i===3)return `<div class="card"><h2>4. Exterior Condition</h2>${pbox('Left Front Quarter Panel','lf_quarter')}${pbox('Left Front — Door Open / Driver Interior','lf_door')}${pbox('Left Rear Exterior','lr_exterior')}${pbox('Left Rear Interior','lr_interior')}${pbox('Trunk / Cargo Area','trunk')}${pbox('Rear / Plate / Hitch / Badging','rear')}${pbox('Spare Tire / Jack / Tools','spare')}${pbox('Right Front Exterior','rf_exterior')}${pbox('Right Front Interior','rf_interior')}${pbox('Right Rear Exterior','rr_exterior')}${pbox('Right Rear Interior','rr_interior')}<label>Exterior Notes<textarea data-path="verification.exteriorNotes"></textarea></label></div>`;
if(i===4)return `<div class="card"><h2>5. Test Drive</h2><div class="grid"><label>Starting Mileage<input data-path="test.startMileage"></label><label>Ending Mileage<input data-path="test.endMileage"></label><label>Approx. Distance<input data-path="test.distance"></label><label>Road Conditions<input data-path="test.road"></label></div>${['Highway','City / Stop-and-Go','Started Normally','Warning Lights Checked','Brake Pedal Feel','Parking Brake','Acceleration','Transmission Shifting','Engine Performance','Steering','Braking','Suspension','Alignment / Pull','Vibration','Noise','Cruise Control','A/C While Driving','4WD / AWD','Steering Wheel Centered','Steering Play','Wheel Returns to Center','Steering Noise'].map(x=>item(x,x,'test.'+slug(x))).join('')}<label>If Test Drive Not Performed<select data-path="test.notPerformed"><option></option><option>Customer declined</option><option>Dealer declined</option><option>Vehicle not operational</option><option>Weather / road conditions</option><option>No permission</option><option>Other</option></select></label><label>Limitations<textarea data-path="test.limitations"></textarea></label></div>`;
if(i===5)return `<div class="card"><h2>6. A/C & HVAC</h2><div class="grid"><label>Ambient Temp<input data-path="hvac.ambient"></label><label>A/C Vent Temp<input data-path="hvac.acTemp"></label><label>Heater Vent Temp<input data-path="hvac.heatTemp"></label></div>${['Blower Speeds','Mode Controls','Defrost','A/C Compressor','Unusual Noise / Odor'].map(x=>item(x,x,'hvac.'+slug(x))).join('')}</div>`;
if(i===6)return `<div class="card"><h2>7. Battery Test</h2><div class="grid"><label>Voltage<input data-path="battery.voltage"></label><label>Rated CCA<input data-path="battery.ratedCCA"></label><label>Measured CCA<input data-path="battery.measuredCCA"></label><label>Result<select data-path="battery.result"><option></option><option>Good</option><option>Recharge / Retest</option><option>Replace</option><option>Unable to Test</option></select></label></div>${pbox('Battery / Tester Evidence','battery_evidence')}<label>Notes<textarea data-path="battery.notes"></textarea></label></div>`;
if(i===7)return `<div class="card"><h2>8. Electrical</h2>${electrical.map(x=>item(x,x,'electrical.'+slug(x))).join('')}</div>`;
if(i===8)return `<div class="card"><h2>9. Engine / Under-Hood</h2>${engine.map(x=>item(x,x,'engine.'+slug(x))).join('')}${pbox('Overall Engine Photo','engine_overall')}</div>`;
if(i>=9&&i<=12){let k=['LF','LR','RF','RR'][i-9],n={'LF':'Left Front','LR':'Left Rear','RF':'Right Front','RR':'Right Rear'}[k];return `<div class="card"><h2>${i+1}. ${n}</h2><div class="corner">${n}</div><div class="grid"><label>Tread Depth<input data-path="corners.${k}.tread"></label><label>PSI<input data-path="corners.${k}.psi"></label><label>Tire Size<input data-path="corners.${k}.size"></label><label>DOT / Date Code<input data-path="corners.${k}.dot"></label><label>Uneven Wear<input data-path="corners.${k}.uneven"></label><label>TPMS<select data-path="corners.${k}.tpms"><option></option><option>Normal</option><option>Warning</option><option>N/A</option></select></label></div>${pbox('Tire Photo','c_'+k+'_tire')}${cornerItems.map(x=>item(x,x,'corners.'+k+'.'+slug(x))).join('')}${pbox('Corner Overall Photo','c_'+k+'_overall')}</div>`}
if(i===13)return `<div class="card"><h2>14. Transmission / Drivetrain</h2>${['Transmission Operation','Transmission Leaks','CV Axles / Boots','Driveshaft / U-Joints','Differential','4WD / AWD'].map(x=>item(x,x,'drivetrain.'+slug(x))).join('')}</div>`;
if(i===14)return `<div class="card"><h2>15. Undercarriage</h2>${['Frame / Unibody','Rust / Corrosion','Exhaust','Fuel System','Visible Leaks','Undercarriage Damage'].map(x=>item(x,x,'undercarriage.'+slug(x))).join('')}${pbox('Undercarriage Overall','undercarriage_overall')}</div>`;
if(i===15){let f=findings();return `<div class="card"><h2>16. Findings Summary</h2><h3>🔴 Failures (${f.fail.length})</h3>${f.fail.length?f.fail.map(x=>`<p><b>${esc(x.name)}</b> — ${esc(x.note)}</p>`).join(''):'<p>None recorded.</p>'}<h3>🟡 Attention (${f.attn.length})</h3>${f.attn.length?f.attn.map(x=>`<p><b>${esc(x.name)}</b> — ${esc(x.note)}</p>`).join(''):'<p>None recorded.</p>'}<h3>🟢 Pass (${f.pass.length})</h3><p class="small">${f.pass.length} items marked Pass.</p><label>Overall Observations<textarea data-path="generalNotes"></textarea></label><label>Inspection Limitations<textarea data-path="limitations"></textarea></label></div>`}
if(i===16)return `<div class="card"><h2>17. Photos & Evidence</h2>${pbox('General Photo / Evidence','general_photo')}<label>Additional Evidence Notes<textarea data-path="generalNotes"></textarea></label></div>`;
return `<div class="card"><h2>18. Professional Report</h2><p>Everything entered in this inspection will be assembled into the report, including OBD-II results, battery test results, measurements, findings and photos.</p><button class="primary" onclick="report()">📄 Generate Report</button></div>`}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')}
function hydrate(){document.querySelectorAll('[data-path]').forEach(e=>{let v=pathGet(state,e.dataset.path);if(v!=null)e.value=v;e.oninput=()=>{pathSet(state,e.dataset.path,e.value);save()};e.onchange=()=>{pathSet(state,e.dataset.path,e.value);save()}});document.querySelectorAll('[data-item]').forEach(e=>{let v=pathGet(state,e.dataset.item)||{},s=v.status||'';e.querySelectorAll('.statusrow button').forEach(b=>b.className=s&&b.textContent===s?s.toLowerCase().replace('attention','attn'):'' )});document.querySelectorAll('[data-grid]').forEach(g=>draw(g.dataset.grid,g));if(step===2)setupPDF()}
function status(path,s){let v=pathGet(state,path);if(!v||typeof v!=='object')pathSet(state,path,{status:s,note:''});else v.status=s;save();render()}
function photo(k){photoKey=k;document.getElementById('camera').value='';document.getElementById('camera').click()}
document.getElementById('camera').onchange=async e=>{for(const f of e.target.files)await addPhoto(photoKey,f);render()};
async function addPhoto(k,f){if(!f.type.startsWith('image/'))return;let d=await imageData(f);(state.photos[k]||(state.photos[k]=[])).push({id:crypto.randomUUID(),name:f.name,data:d});save()}
function imageData(f){return new Promise(ok=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let max=1500,s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(f)})}
function draw(k,g){g.innerHTML=(state.photos[k]||[]).map(p=>`<div class="photo"><img src="${p.data}"><button onclick="rmPhoto('${k}','${p.id}')">×</button></div>`).join('')}
function rmPhoto(k,id){state.photos[k]=(state.photos[k]||[]).filter(x=>x.id!==id);save();render()}
function setupPDF(){let el=document.getElementById('pdf');if(!el)return;el.onchange=async()=>{let f=el.files[0];if(!f)return;state.obd.pdfName=f.name;document.getElementById('pdfStatus').textContent='PDF attached. DTC extraction is available when the browser can read the PDF text.';try{let text=await pdfText(f),codes=[...new Set((text.match(/\b[PCBU][0-9A-F]{4}\b/gi)||[]).map(x=>x.toUpperCase()))];state.obd.pdfText=text.slice(0,20000);if(codes.length)state.obd.codes=[...new Set(state.obd.codes.split(/[,\s]+/).filter(Boolean).concat(codes))].join(', ');document.getElementById('pdfStatus').textContent=`Attached: ${f.name}${codes.length?' • Codes found: '+codes.join(', '):' • Verify DTCs manually.'}`;save();hydrate()}catch(e){document.getElementById('pdfStatus').textContent='PDF attached. Enter DTCs manually if this is an image/scanned PDF.';save()}}}
async function pdfText(f){if(!window.pdfjsLib){await new Promise((ok,no)=>{let s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.js'}let b=await f.arrayBuffer(),p=await pdfjsLib.getDocument({data:b}).promise,t='';for(let i=1;i<=p.numPages;i++){let pg=await p.getPage(i),c=await pg.getTextContent();t+=c.items.map(x=>x.str).join(' ')+'\n'}return t}
function findings(){let o={fail:[],attn:[],pass:[]};function walk(x,p=''){if(!x||typeof x!=='object')return;if(x.status){let z={name:p.split('.').pop().replace(/_/g,' '),note:x.note||''};if(x.status==='FAIL')o.fail.push(z);if(x.status==='ATTENTION')o.attn.push(z);if(x.status==='PASS')o.pass.push(z)}Object.keys(x).forEach(k=>{if(k!=='photos'&&k!=='pdfText')walk(x[k],p?p+'.'+k:k)})}walk(state);return o}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function row(n,v){let s=v?.status||'N/A',c=s==='PASS'?'rpass':s==='ATTENTION'?'rattn':s==='FAIL'?'rfail':'';return `<tr class="${c}"><td>${esc(n)}</td><td><b>${s}</b></td><td>${esc(v?.note||'')}</td></tr>`}
function rows(o,p=''){let a=[];if(!o||typeof o!=='object')return a;for(let k of Object.keys(o)){if(k==='photos'||k==='pdfText')continue;let v=o[k];if(v&&typeof v==='object'&&v.status)a.push(row(p?p+' — '+k.replace(/_/g,' '):k.replace(/_/g,' '),v));else if(v&&typeof v==='object')a.push(...rows(v,p?p+' — '+k.replace(/_/g,' '):k.replace(/_/g,' ')))}return a}
function photos(){let s='';for(let [k,a] of Object.entries(state.photos||{}))if(a.length)s+=`<div class="report-page"><h3>${esc(k.replace(/_/g,' '))}</h3><div class="rphotos">${a.map(p=>`<img src="${p.data}">`).join('')}</div></div>`;return s}
function report(){save();state.completed=true;save();show('reportScreen');let f=findings(),v=state.vehicle,c=state.customer;document.getElementById('report').innerHTML=`<h1>${esc(biz.name)}</h1><b>Professional Vehicle Inspection Report — V3</b><p class="small">Generated ${new Date().toLocaleString()}</p><table><tr><th>Customer</th><td>${esc(c.name)}</td><th>Inspection</th><td>${esc(c.type)}</td></tr><tr><th>Vehicle</th><td>${esc(v.year)} ${esc(v.make)} ${esc(v.model)}</td><th>Price</th><td>$${esc(state.price)}</td></tr><tr><th>VIN</th><td>${esc(v.vin)}</td><th>Mileage</th><td>${esc(v.mileage)}</td></tr><tr><th>Plate</th><td>${esc(v.plate)} ${esc(v.state)}</td><th>Inspector</th><td>${esc(c.inspector||biz.inspector)}</td></tr></table><h2>Major Findings</h2><h3>🔴 Failures (${f.fail.length})</h3>${f.fail.length?f.fail.map(x=>`<p><b>${esc(x.name)}</b> — ${esc(x.note)}</p>`).join(''):'<p>None recorded.</p>'}<h3>🟡 Attention (${f.attn.length})</h3>${f.attn.length?f.attn.map(x=>`<p><b>${esc(x.name)}</b> — ${esc(x.note)}</p>`).join(''):'<p>None recorded.</p>'}<h2>OBD-II Scan</h2><table><tr><th>Scan</th><td>${esc(state.obd.scan)}</td></tr><tr><th>DTC Codes</th><td>${esc(state.obd.codes||'None entered')}</td></tr><tr><th>Warning Lights</th><td>${esc(state.obd.warning)}</td></tr><tr><th>PDF Evidence</th><td>${esc(state.obd.pdfName||'Not attached')}</td></tr></table><h2>Battery Test</h2><table>${Object.entries(state.battery).map(([k,v])=>`<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('')}</table><h2>Inspection Results</h2><table><tr><th>Item</th><th>Status</th><th>Notes</th></tr>${rows(state.engine,'Engine / Under-Hood').concat(rows(state.electrical,'Electrical'),rows(state.drivetrain,'Transmission / Drivetrain'),rows(state.undercarriage,'Undercarriage'),...['LF','LR','RF','RR'].flatMap(k=>rows(state.corners[k],k))).join('')}</table><h2>Test Drive</h2><table>${Object.entries(state.test).map(([k,v])=>`<tr><th>${esc(k)}</th><td>${esc(typeof v==='object'?v.note||v.status||'':v)}</td></tr>`).join('')}</table><h2>A/C & HVAC</h2><table>${Object.entries(state.hvac).map(([k,v])=>`<tr><th>${esc(k)}</th><td>${esc(typeof v==='object'?v.note||v.status||'':v)}</td></tr>`).join('')}</table><h2>General Observations</h2><p>${esc(state.generalNotes)}</p><p><b>Limitations:</b> ${esc(state.limitations)}</p><h2>Photos & Evidence</h2>${photos()}<hr><p>${esc(biz.disclaimer)}</p><p style="margin-top:40px">Inspector Signature: ______________________________</p><p>Date: ____________________</p>`}
async function settings(){show('settings');let a=await all('settings');let s=a[0]||biz;document.getElementById('sName').value=s.name;document.getElementById('sInspector').value=s.inspector;document.getElementById('sDisclaimer').value=s.disclaimer}
async function saveSettings(){await put({id:'business',name:document.getElementById('sName').value,inspector:document.getElementById('sInspector').value,disclaimer:document.getElementById('sDisclaimer').value},'settings');msg('Settings saved')}
function msg(t){let x=document.getElementById('msg');if(!x){x=document.createElement('div');x.id='msg';x.style='position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#111827;color:white;padding:10px 14px;border-radius:9px;z-index:50';document.body.appendChild(x)}x.textContent=t;x.hidden=false;setTimeout(()=>x.hidden=true,1200)}
openDB();
</script></body></html>
